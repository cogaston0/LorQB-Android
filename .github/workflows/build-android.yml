name: Build LorQB Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ── 2. Cache Unity Library folder ────────────────────────────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Verify Unity project structure
        run: |
          echo "Checking Unity project files..."
          test -f ProjectSettings/ProjectSettings.asset || \
            (echo "ERROR: ProjectSettings/ProjectSettings.asset not found" && exit 1)
          test -f Packages/manifest.json || \
            (echo "ERROR: Packages/manifest.json not found" && exit 1)
          echo "Project structure OK"
          grep -q "com.unity.ugui" Packages/manifest.json || \
            echo "WARNING: com.unity.ugui not found in manifest.json"
          grep -q "com.unity.textmeshpro" Packages/manifest.json || \
            echo "WARNING: com.unity.textmeshpro not found in manifest.json"

      # ── 3. Build with game-ci/unity-builder ──────────────────────────
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:     ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:       ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:    ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform:    Android
          projectPath: .
          unityVersion:      6000.4.5f1
          buildName:         LorQB
          buildsPath:        build
          androidExportType: androidPackage
          androidKeystoreName:     ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass:     ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName:     ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass:     ${{ secrets.ANDROID_KEYALIAS_PASS }}

      # ── 4. Upload APK artifact ────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LorQB-Android-APK
          path: build/Android/*.apk
          retention-days: 14

# rebuild trigger
