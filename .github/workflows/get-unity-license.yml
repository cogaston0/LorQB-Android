name: Get Unity License (Run Once)

on:
  workflow_dispatch:

jobs:
  get-unity-license:
    name: Request Unity License File
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity .alf activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getalf
        with:
          unityVersion: 6000.4.5f1

      - name: Upload .alf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_activation_file
          path: ${{ steps.getalf.outputs.filePath }}
          retention-days: 1
